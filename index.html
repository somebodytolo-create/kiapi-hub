<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>전략기획본부 과제 관리</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#f7f8fa;--card:#fff;--line:#e5e7eb;--line2:#eef0f3;
  --ink:#111827;--ink2:#4b5563;--ink3:#8b95a1;
  --blue:#1d4ed8;--blue-soft:#eef3ff;--navy1:#0d1b3e;--navy2:#1e3a8a;--navy3:#1e40af;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.04);
}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#171a21;--line:#262a33;--line2:#1f232b;
  --ink:#e8eaee;--ink2:#a9b0bc;--ink3:#7a828f;--blue:#7aa2ff;--blue-soft:#1a2340;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;height:56px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.logo svg{flex:none}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav button{border:0;background:none;color:var(--ink2);padding:7px 12px;border-radius:8px;font-size:14px;font-weight:550;white-space:nowrap}
.nav button:hover{background:var(--line2);color:var(--ink)}
.nav button.on{color:var(--blue);background:var(--blue-soft)}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink2);width:34px;height:34px;border-radius:9px;display:grid;place-items:center}

/* 히어로 */
.hero{background:radial-gradient(1200px 400px at 85% -10%,rgba(96,165,250,.28),transparent 60%),linear-gradient(135deg,var(--navy1),var(--navy2) 55%,var(--navy3));color:#fff}
.hero .wrap{padding-top:44px;padding-bottom:40px}
.today{font-size:13.5px;color:#a5b4fc;font-weight:500}
.hero h1{font-size:34px;line-height:1.25;letter-spacing:-.025em;margin:10px 0 8px;font-weight:750}
.hero p.sub{margin:0;color:#c7d2fe;font-size:16px}

.quick{display:grid;grid-template-columns:repeat(3,1fr);margin-top:30px;border-top:1px solid rgba(255,255,255,.16)}
.qcol{padding:16px 20px 2px;border-left:1px solid rgba(255,255,255,.12)}
.qcol:first-child{border-left:0;padding-left:0}
.qcol h5{margin:0 0 8px;font-size:12.5px;font-weight:600;color:#a5b4fc;letter-spacing:.01em}
.qcol a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;font-size:15px;font-weight:550;color:#fff;border-bottom:1px solid rgba(255,255,255,.07)}
.qcol a:last-child{border-bottom:0}
.qcol a span{color:#7f93d9;transition:transform .15s,color .15s}
.qcol a:hover span{transform:translateX(3px);color:#fff}

/* 섹션 공통 */
section.block{padding:40px 0 8px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.sh h2{font-size:19px;margin:0;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.sh h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}
.sh .more{font-size:13.5px;color:var(--ink3)}
.sh .more:hover{color:var(--blue)}

/* 대시보드 카드 */
.boards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.board{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px;transition:border-color .15s,transform .15s}
.board:hover{border-color:color-mix(in srgb,var(--blue) 40%,var(--line));transform:translateY(-1px)}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kind{font-size:12.5px;font-weight:600;color:var(--blue)}
.lock{font-size:12px;color:var(--ink3);border:1px solid var(--line);padding:2px 8px;border-radius:999px;white-space:nowrap}
.board h3{margin:0;font-size:18px;letter-spacing:-.015em}
.board .q{margin:0;color:var(--ink2);font-size:14.5px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin:2px 0 0;padding-top:12px;border-top:1px solid var(--line2)}
.meta dt{color:var(--ink3)}
.meta dd{margin:0;color:var(--ink)}
.acts{display:flex;gap:8px;margin-top:auto}
.btn{flex:1;text-align:center;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:9px;font-size:14px;font-weight:600}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:hover{filter:brightness(.97)}

/* 최근 업데이트 */
.feed{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:6px 14px;padding:14px 20px;border-top:1px solid var(--line2)}
.item:first-child{border-top:0}
.item:hover{background:color-mix(in srgb,var(--blue-soft) 55%,transparent);cursor:pointer}
.no{font-size:13px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.item .t{font-weight:600;font-size:14.5px}
.item .s{grid-column:2;font-size:13px;color:var(--ink3)}
.src{display:inline-block;font-size:12px;font-weight:600;color:var(--blue);margin-right:8px}
.new{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.when{font-size:13px;color:var(--ink3);white-space:nowrap;grid-row:1/span 2;grid-column:3}

/* 바로보기(내장) — 상단 바 아래 화면 전체를 대시보드가 차지, 스크롤은 대시보드 하나만 */
.viewer{display:none;position:fixed;top:56px;left:0;right:0;bottom:0;background:var(--bg)}
body.viewing{overflow:hidden}
body.viewing .home,body.viewing footer{display:none}
body.viewing .viewer{display:block}
.frame{width:100%;height:100%;border:0;display:block;background:var(--card)}
.ext{display:none;font-size:13.5px;color:var(--blue);font-weight:600;white-space:nowrap}
body.viewing .ext{display:inline}

/* 푸터 */
footer{margin-top:56px;border-top:1px solid var(--line);background:var(--card)}
footer .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px;padding-top:32px;padding-bottom:28px}
footer h4{margin:0 0 10px;font-size:13px;color:var(--ink3);font-weight:600}
footer a,footer p{display:block;font-size:14px;color:var(--ink2);margin:0 0 7px}
footer a:hover{color:var(--blue)}
.copy{grid-column:1/-1;border-top:1px solid var(--line2);padding-top:16px;font-size:12.5px;color:var(--ink3);display:flex;justify-content:space-between}

/* 질문하기 — 떠 있는 버튼 + 오른쪽 패널 */
.fab{position:fixed;right:22px;bottom:22px;z-index:40;display:flex;align-items:center;gap:8px;height:46px;padding:0 18px 0 14px;border:0;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:14.5px;box-shadow:0 6px 20px rgba(29,78,216,.32)}
.fab svg{flex:none}
body.chatting .fab{display:none}
.chat{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(460px,100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(16,24,40,.10);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;visibility:hidden}
body.chatting .chat{transform:none;visibility:visible}
.chat-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.chat-h b{font-size:16px;letter-spacing:-.01em}
.chat-h small{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px}
.chat-x{border:1px solid var(--line);background:var(--card);color:var(--ink2);width:32px;height:32px;border-radius:8px;flex:none;font-size:16px;line-height:1}
.chat-b{flex:1;overflow-y:auto;padding:16px 18px 8px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.msg-q{align-self:flex-end;max-width:86%;background:var(--blue-soft);color:var(--ink);padding:9px 13px;border-radius:14px 14px 4px 14px;font-size:14.5px}
.msg-a{align-self:stretch;font-size:14.5px;line-height:1.65}
.msg-a .tx b{color:var(--ink);font-weight:700}
.msg-a .tx a{color:var(--blue)}
.tbl{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:600;color:var(--ink3);background:var(--bg);padding:7px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 10px;border-top:1px solid var(--line2);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl td:not(:first-child){white-space:nowrap}
.tbl tr.hl td{background:color-mix(in srgb,var(--blue-soft) 70%,transparent)}
.tbl a[data-ask]{color:var(--ink);cursor:pointer;border-bottom:1px dotted var(--ink3)}
.tbl a[data-ask]:hover{color:var(--blue);border-color:var(--blue)}
.tbl .more-row td{text-align:center;padding:0}
.tbl .more-row button{border:0;background:none;color:var(--ink3);font-size:12.5px;padding:7px;width:100%}
.mut{color:var(--ink3);font-size:12px}
.warn{color:#b45309;font-weight:600}
.bad{color:#c2410c;font-weight:700}
.tag{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:1px 6px;border-radius:999px;margin-left:4px}
.note{margin-top:8px;font-size:12.5px;color:var(--ink3);line-height:1.55}
.srcs{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
.srcs a{font-size:12.5px;color:var(--blue);font-weight:600;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:5px 11px;font-size:13px;text-align:left}
.chips button:hover{border-color:var(--blue);color:var(--blue)}
.chips.col{flex-direction:column;align-items:flex-start}
.chat-f{border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px}
.chat-f input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 13px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg)}
.chat-f input:focus{outline:none;border-color:var(--blue)}
.chat-f button{height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700}
.chat-hint{font-size:12px;color:var(--ink3);padding:0 18px 4px}

@media (max-width:900px){
  .boards{grid-template-columns:1fr}
  footer .wrap{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
  .quick{grid-template-columns:1fr}
  .qcol{border-left:0;padding-left:0;padding-right:0}
  .wrap{padding:0 16px}
  .hero h1{font-size:26px}
  .top .wrap{gap:12px}
  .logo span{display:none}
  .item{grid-template-columns:32px 1fr;padding:13px 16px}
  .when{grid-row:auto;grid-column:2}
  
}
</style>
</head>
<body>
<style>
#gate{position:fixed;inset:0;z-index:99999;
  font-family:'Pretendard','Nanum Gothic','나눔고딕','Malgun Gothic','맑은 고딕',sans-serif;
  color:#0f172a;font-size:14px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;padding:24px;
  background:#f1f5f9}
#gate *{box-sizing:border-box}
#gate form{margin:0}
#gate .msg{margin-top:14px;font-size:12.5px;min-height:18px;color:#e11d48}
#gate .msg.busy{color:#64748b}
#gate .lock{display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:#94a3b8;margin-top:22px}
#gate .lock svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;
  fill:none;stroke-linecap:round;stroke-linejoin:round}
#gate .sig{margin-left:auto;padding-left:12px;font-size:12px;font-weight:600;
  color:#94a3b8;letter-spacing:.2px;white-space:nowrap}
#gate label.f{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:7px}
#gate input.pw{width:100%;padding:12px 14px;border:1px solid #cbd5e1;
  border-radius:10px;font-size:14px;font-family:inherit;color:#0f172a;
  background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
#gate input.pw:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
#gate .rem{display:flex;align-items:center;gap:8px;margin:14px 0 22px;
  font-size:12.5px;color:#475569;cursor:pointer;user-select:none}
#gate .rem input{width:15px;height:15px;accent-color:#1e40af;cursor:pointer}
#gate button[type=submit]{width:100%;padding:13px;border:0;border-radius:10px;cursor:pointer;
  background:#1e40af;color:#fff;font-size:14px;font-weight:700;font-family:inherit;
  letter-spacing:-.2px;transition:background .15s}
#gate button[type=submit]:hover:not(:disabled){background:#1a3691}
#gate button[type=submit]:disabled{background:#cbd5e1;cursor:default}
body.locked{overflow:hidden}
body.locked>*:not(#gate){display:none !important}

#gate{padding:0}
#gate .box{display:grid;grid-template-columns:1fr 1fr;
  width:100%;max-width:840px;min-height:430px;margin:24px;
  background:#fff;border:1px solid #e2e8f0;border-radius:20px;overflow:hidden;
  box-shadow:0 4px 20px rgba(13,27,62,.07)}
#gate .side{position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0d1b3e 0%,#1e3a8a 45%,#1e40af 100%);
  color:#fff;padding:44px 38px;display:flex;flex-direction:column}
#gate .side::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 70% -10%,rgba(96,165,250,.20) 0%,transparent 60%),
             radial-gradient(ellipse 45% 45% at 5% 105%,rgba(124,58,237,.16) 0%,transparent 60%)}
#gate .side>*{position:relative;z-index:1}
#gate .side .mark{width:52px;height:52px;border-radius:16px;font-size:25px;
  background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.08));
  border:1px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;margin-bottom:auto}
#gate .side h1{font-size:23px;font-weight:800;letter-spacing:-.5px;
  margin:0 0 10px;line-height:1.34}
#gate .side p{font-size:12.5px;color:rgba(255,255,255,.68);margin:0;line-height:1.7;
  font-weight:400}
#gate .side .kv{display:flex;gap:24px;margin-top:22px;
  padding-top:18px;border-top:1px solid rgba(255,255,255,.13)}
#gate .side .kv b{display:block;font-size:11px;font-weight:400;
  color:rgba(255,255,255,.5);margin-top:3px;letter-spacing:.02em}
#gate .side .kv span{font-size:17px;font-weight:800;letter-spacing:-.3px}
#gate .pane{padding:44px 40px;display:flex;flex-direction:column;justify-content:center}
#gate .pane .ttl{font-size:15px;font-weight:700;margin:0 0 6px;letter-spacing:-.2px}
#gate .pane .sub{font-size:12.5px;color:#64748b;margin:0 0 24px}
@media(max-width:760px){
  #gate .box{grid-template-columns:1fr;min-height:0;margin:16px}
  #gate .side{padding:30px 28px 26px}
  #gate .side .mark{width:44px;height:44px;font-size:21px;border-radius:13px;margin-bottom:18px}
  #gate .side h1{font-size:19px}
  #gate .side p{font-size:12px}
  #gate .side .kv{display:none}
  #gate .pane{padding:30px 28px 34px}
  #gate .pane .ttl{display:none}
  #gate .pane .sub{margin-bottom:18px}
}

#gate{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  overflow-y:auto;overscroll-behavior:contain}
body.locked{overflow:hidden;overscroll-behavior:none}

/* iOS는 16px 미만 입력창에 포커스하면 화면을 확대해버린다 → 16px 고정 */
#gate input.pw{font-size:16px}

/* 암호 표시 토글 */
#gate .field{position:relative}
#gate .field input.pw{padding-right:48px}
#gate button.peek,#gate button.peek:hover{width:40px;height:40px;padding:0;margin:0;
  position:absolute;top:50%;right:5px;transform:translateY(-50%);
  border:0;border-radius:10px;background:transparent;box-shadow:none;
  color:#94a3b8;display:flex;align-items:center;justify-content:center;cursor:pointer}
#gate button.peek:active{color:#1e40af}
#gate button.peek svg{width:19px;height:19px;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

/* 버튼: 손가락 크기(≥48px) + 더블탭 확대 방지 + 로딩 스피너 */
#gate button[type=submit]{min-height:50px;touch-action:manipulation}
#gate .spin{display:inline-block;width:14px;height:14px;vertical-align:-2px;
  margin-right:7px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;
  border-radius:50%;animation:gspin .7s linear infinite}
@keyframes gspin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#gate .spin{animation-duration:2s}}

/* 체크박스 탭 영역 확대 */
#gate .rem{padding:5px 0;min-height:34px}
#gate .rem input{width:18px;height:18px;flex:none}

/* 좁은 화면: 위쪽 정렬(키보드가 올라와도 카드가 가려지지 않게) + 안전영역 */
@media(max-width:520px){
  #gate{align-items:flex-start;justify-content:stretch;
    padding:max(22px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-left))
            calc(22px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right))}
  #gate .box{max-width:none;width:100%;margin:0;border-radius:16px;
    padding:30px 22px 26px;min-height:0}
  #gate .box.split{padding:0}   /* 좌우분할안은 색면이 카드 끝까지 차야 한다 */
  #gate h1,#gate .side h1{font-size:19px}
  #gate .org,#gate .note{margin-bottom:18px}
  #gate .pane{padding:26px 22px 28px}
  #gate .side{padding:26px 22px 24px}
  #gate .lock{margin-top:18px}
}

/* 가로모드/낮은 화면: 세로 여백을 줄여 한 화면에 들어오게 */
@media(max-height:620px){
  #gate{align-items:flex-start}
  #gate .box{padding-top:24px;padding-bottom:22px}
  #gate .box.split{padding:0;min-height:0;margin:16px}
  #gate .side .kv{display:none}
  #gate .side{padding:22px 24px}
  #gate .side h1{font-size:18px;margin-bottom:7px}
  #gate .side p{font-size:11.5px}
  #gate .pane{padding:22px 24px}
  #gate .pane .ttl{margin-bottom:3px}
  #gate .pane .sub{margin-bottom:14px}
  #gate .rem{margin:10px 0 14px}
  #gate .org{margin-bottom:16px}
  #gate .lock{margin-top:14px}
}
</style>
<div id="gate"><div class="box split">
  <div class="side">
    <div class="mark"><svg width="26" height="26" viewBox="0 0 22 22" aria-hidden="true"><rect x="5" y="5" width="5" height="5" rx="1.2" fill="#fff"/><rect x="12" y="5" width="5" height="5" rx="1.2" fill="#fff" opacity=".6"/><rect x="5" y="12" width="5" height="5" rx="1.2" fill="#fff" opacity=".6"/><rect x="12" y="12" width="5" height="5" rx="1.2" fill="#fff" opacity=".35"/></svg></div>

  var KEY = 'kiapihub_pw';
  // 같은 도메인의 개별 대시보드 게이트 키 — 허브에서 '기억'하면 iframe 속 대시보드도 바로 열린다
  var SIBLING_KEYS = ['kiapirnd_pw','kiapikpi_pw'];
  var msg = document.getElementById('gmsg');
  var btn = document.getElementById('gbtn');
  var pw  = document.getElementById('gpw');
  var peek = document.getElementById('gpeek');
  var LABEL = btn.textContent;
  var FINE = !!(window.matchMedia && matchMedia('(pointer:fine)').matches);
  document.body.classList.add('locked');

  function busy(on){
    btn.disabled = on;
    if (on) { btn.innerHTML = '<span class="spin"></span>확인 중'; }
    else { btn.textContent = LABEL; }
  }

  function b2a(b64s){
    var s = atob(b64s), a = new Uint8Array(s.length);
    for (var i=0;i<s.length;i++) a[i] = s.charCodeAt(i);
    return a;
  }

  async function unlock(password){
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(password),
                    {name:'PBKDF2'}, false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b2a(VAULT.salt), iterations:VAULT.it, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:b2a(VAULT.iv)}, key, b2a(VAULT.ct));
    return new TextDecoder().decode(plain);
  }

  function run(html){
    document.body.classList.remove('locked');
    var g = document.getElementById('gate');
    if (g) g.remove();

    // innerHTML로 넣은 <script>는 실행되지 않는다 → 떼어내고 script 요소로 다시 주입
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    var codes = [];
    Array.prototype.slice.call(tmp.querySelectorAll('script')).forEach(function(s){
      codes.push({src:s.getAttribute('src'), text:s.textContent});
      s.parentNode.removeChild(s);
    });
    while (tmp.firstChild) document.body.appendChild(tmp.firstChild);
    codes.forEach(function(c){
      var s = document.createElement('script');
      if (c.src) s.src = c.src; else s.textContent = c.text;
      document.body.appendChild(s);
    });
  }

  async function attempt(password, remember, silent){
    busy(true);
    msg.className = 'msg busy';
    msg.textContent = '';
    try {
      var html = await unlock(password);
      if (remember) { try { localStorage.setItem(KEY, password);
        SIBLING_KEYS.forEach(function(k){ if (!localStorage.getItem(k)) localStorage.setItem(k, password); }); } catch(e){} }
      run(html);
    } catch (e) {
      try { localStorage.removeItem(KEY); } catch(e2){}
      busy(false);
      msg.className = 'msg';
      msg.textContent = silent ? '' : '암호가 맞지 않습니다.';
      pw.value = ''; pw.focus();
    }
  }

  if (!(window.crypto && crypto.subtle)) {
    msg.className = 'msg';
    // 파일 직접 열기(file://)나 http:// 접속은 브라우저가 복호화 API를 막는다
    msg.textContent = (location.protocol === 'https:' || location.hostname === 'localhost')
      ? '이 브라우저에서는 복호화를 지원하지 않습니다.'
      : '보안 연결(https)로 접속해야 열람할 수 있습니다.';
    btn.disabled = true;
    return;
  }

  document.getElementById('gform').addEventListener('submit', function(ev){
    ev.preventDefault();
    if (!pw.value || btn.disabled) return;
    pw.blur();   // 모바일: 키보드를 내려 진행 상태가 보이게
    attempt(pw.value, document.getElementById('gremember').checked, false);
  });

  // 암호 표시/숨김 (모바일 오타 확인용)
  if (peek) peek.addEventListener('click', function(){
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    peek.setAttribute('aria-pressed', show ? 'true' : 'false');
    peek.setAttribute('aria-label', show ? '암호 숨김' : '암호 표시');
    document.getElementById('gicon-on').style.display  = show ? 'none' : '';
    document.getElementById('gicon-off').style.display = show ? '' : 'none';
    pw.focus();
    try { pw.setSelectionRange(pw.value.length, pw.value.length); } catch(e){}
  });

  // 모바일 키보드가 올라올 때 입력창이 가려지지 않도록
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', function(){
      if (document.activeElement === pw && pw.scrollIntoView)
        pw.scrollIntoView({block:'center', behavior:'smooth'});
    });
  }

  // 자동 포커스는 마우스 환경에서만 — 터치에서는 키보드가 튀어오르지 않게
  if (FINE) pw.focus();

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved) attempt(saved, true, true);
})();
